# Bundle patch layer of dsh-skin-strata (api-notes §1.2 form).
#
# Row id doubles as the skin's settings namespace. 本皮肤的外观设置由皮肤自己
# 持久化（localStorage，皮肤自治），因此这里不声明 config。
#   row id       : dsh-skin-strata
#   skin id      : skins.strata
#   package name : dsh-skin-strata
- insert:
    - id: dsh-skin-strata
      name: "dsh-skin-strata"
